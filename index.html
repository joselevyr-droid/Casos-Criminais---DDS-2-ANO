<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Casos Criminais</title>

  <style>

    /* =========================================
       RESET
    ========================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #030303;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      position: relative;
    }


    /* =========================================
       FUNDO
    ========================================= */

    .mancha {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(110px);
      opacity: 0.18;
    }

    .mancha1 {
      width: 500px;
      height: 500px;
      top: -250px;
      left: -180px;
      background: #7a0000;
    }

    .mancha2 {
      width: 600px;
      height: 600px;
      right: -300px;
      bottom: -250px;
      background: #520000;
    }

    .mancha3 {
      width: 350px;
      height: 350px;
      left: 40%;
      top: 30%;
      background: #450000;
      opacity: 0.10;
    }


    /* =========================================
       TÍTULO
    ========================================= */

    .titulo {
      position: absolute;

      top: 38px;
      left: 50px;

      z-index: 20;
    }

    .titulo h1 {
      font-size: 25px;
      font-weight: 500;

      letter-spacing: 5px;
      text-transform: uppercase;

      color: #eeeeee;
    }

    .linha {
      width: 100%;
      height: 2px;

      background: #9b0000;

      margin-top: 12px;

      box-shadow:
        0 0 10px rgba(150, 0, 0, 0.4);
    }


    /* =========================================
       LAYOUT PRINCIPAL
    ========================================= */

    .pagina {
      position: absolute;

      inset: 0;

      width: 100vw;
      height: 100vh;

      display: grid;

      grid-template-columns:
        900px
        minmax(0, 1fr);

      column-gap: 60px;

      align-items: center;

      padding:
        100px
        5vw
        40px
        5vw;
    }


    /* =========================================
       CAPA PRINCIPAL
    ========================================= */

    .capa {
      position: relative;

      width: 550px;
      min-width: 550px;
      max-width: 550px;

      height: 78vh;

      background: #080808;

      border: 1px solid #242424;

      border-radius: 3px;

      overflow: hidden;

      box-shadow:
        0 20px 80px rgba(0, 0, 0, 0.9),
        inset 0 0 50px rgba(0, 0, 0, 0.8);

      transition: 0.4s ease;
    }

    .capa:hover {
      border-color: #4d0000;

      box-shadow:
        0 20px 80px rgba(0, 0, 0, 0.95),
        0 0 30px rgba(100, 0, 0, 0.15),
        inset 0 0 50px rgba(0, 0, 0, 0.8);
    }


    /* =========================================
       BORDA INTERNA DA CAPA
    ========================================= */

    .capa::before {
      content: "";

      position: absolute;

      inset: 12px;

      border: 1px solid #171717;

      pointer-events: none;

      z-index: 4;
    }


    /* =========================================
       DEGRADÊ ESCURO DA CAPA
    ========================================= */

    .capa::after {
      content: "";

      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      height: 45%;

      background: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0, 0, 0, 0.45) 30%,
        rgba(0, 0, 0, 0.75) 45%,
        rgba(0, 0, 0, 0.98) 100%
      );

      pointer-events: none;

      z-index: 2;
    }


    /* =========================================
       IMAGEM DA CAPA
    ========================================= */

    .capa img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
    }


    /* =========================================
       INFORMAÇÕES DA CAPA
    ========================================= */

    .info-caso {
      position: absolute;

      left: 0;
      bottom: 30px;

      width: 100%;

      padding: 0 30px;

      text-align: center;

      z-index: 5;
    }

    .nome-caso {
      color: #e5e5e5;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 25px;

      font-weight: 400;

      letter-spacing: 4px;

      text-shadow:
        0 2px 12px #000;
    }

    .descricao-caso {
      margin-top: 10px;

      color:
        rgba(220, 220, 220, 0.48);

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 10px;

      line-height: 1.5;

      letter-spacing: 1px;

      text-shadow:
        0 2px 8px #000;
    }


    /* =========================================
       CATÁLOGO
    ========================================= */

    .catalogo {
      width: 100%;

      height: 78vh;

      min-width: 0;

      margin: 0;

      display: flex;

      flex-direction: column;
    }


    /* =========================================
       TÍTULO DO CATÁLOGO
    ========================================= */

    .catalogo-titulo {
      flex-shrink: 0;

      height: 30px;

      display: flex;

      align-items: center;

      gap: 15px;

      margin-bottom: 15px;

      color: #555;

      font-size: 14px;

      letter-spacing: 4px;
    }

    .linha-catalogo {
      width: 80px;

      height: 2px;

      background: #650000;
    }


    /* =========================================
       GRADE DOS CASOS
    ========================================= */

    .lista-casos {
      width: 100%;

      /*
        O catálogo ocupa o espaço restante.
        Como existem mais casos que cabem na tela,
        a área recebe rolagem vertical.
      */
      flex: 1;

      min-height: 0;

      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      /*
        Cada caso possui altura fixa.
        Novos casos continuam sendo adicionados
        para baixo.
      */
      grid-auto-rows: 250px;

      gap: 20px;

      overflow-y: auto;

      overflow-x: hidden;

      padding-right: 10px;

      scroll-behavior: smooth;

      /*
        Firefox
      */
      scrollbar-width: thin;

      scrollbar-color:
        #4d0000
        #080808;
    }


    /* =========================================
       SCROLLBAR - CHROME / EDGE / SAFARI
    ========================================= */

    .lista-casos::-webkit-scrollbar {
      width: 6px;
    }

    .lista-casos::-webkit-scrollbar-track {
      background: #080808;
    }

    .lista-casos::-webkit-scrollbar-thumb {
      background: #4d0000;

      border-radius: 10px;
    }

    .lista-casos::-webkit-scrollbar-thumb:hover {
      background: #750000;
    }


    /* =========================================
       CADA CASO
    ========================================= */

    .caso {
      position: relative;

      overflow: hidden;

      min-width: 0;
      min-height: 0;

      background: #080808;

      border: 1px solid #1b1b1b;

      transition: 0.4s ease;
    }


    /* =========================================
       IMAGEM DOS CASOS
    ========================================= */

    .caso img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      filter:
        brightness(0.65);

      transition: 0.5s ease;
    }


    /* =========================================
       DEGRADÊ DOS CASOS
    ========================================= */

    .degrade-caso {
      position: absolute;

      inset: 0;

      background: linear-gradient(
        to left,

        rgba(0, 0, 0, 0.65) 0%,

        rgba(0, 0, 0, 0.55) 20%,

        rgba(0, 0, 0, 0.15) 45%,

        transparent 100%
      );

      pointer-events: none;
    }


    /* =========================================
       NOME DOS CASOS
    ========================================= */

    .nome-catalogo {
      position: absolute;

      left: 20px;
      bottom: 18px;

      z-index: 5;

      text-shadow:
        0 2px 10px #000;
    }

    .nome-catalogo small {
      display: block;

      margin-bottom: 5px;

      color: #700000;

      font-size: 8px;

      letter-spacing: 3px;
    }

    .nome-catalogo h3 {
      color: #ddd;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 19px;

      font-weight: 400;

      letter-spacing: 2px;
    }


    /* =========================================
       HOVER DOS CASOS
    ========================================= */

    .caso:hover {
      border-color: #4d0000;

      transform:
        translateY(-2px);

      box-shadow:

        0 15px 40px
        rgba(0, 0, 0, 0.8),

        0 0 20px
        rgba(100, 0, 0, 0.12);
    }

    .caso:hover img {
      transform:
        scale(1.04);

      filter:
        brightness(0.8);
    }


    /* =========================================
       DECORAÇÃO
    ========================================= */

    .decoracao {
      position: absolute;

      right: 50px;
      bottom: 40px;

      width: 100px;

      height: 1px;

      background: #250000;
    }

    .decoracao::after {
      content: "";

      position: absolute;

      right: 0;
      top: -3px;

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #700000;
    }


    /* =========================================
       TELAS ATÉ 1400PX
    ========================================= */

    @media (max-width: 1400px) {

      .pagina {

        grid-template-columns:
          650px
          minmax(0, 1fr);

        column-gap: 25px;

        padding-left: 30px;
        padding-right: 30px;
      }

      .capa {

        width: 650px;

        min-width: 650px;

        max-width: 650px;
      }
    }


    /* =========================================
       TELAS MENORES
    ========================================= */

    @media (max-width: 800px) {

      html,
      body {
        overflow-y: auto;
        overflow-x: hidden;
      }


      .pagina {

        position: relative;

        width: 100%;

        height: auto;

        min-height: 100vh;

        display: flex;

        flex-direction: column;

        align-items: center;

        gap: 40px;

        padding:
          100px
          25px
          50px;
      }


      /* -------------------------
         TÍTULO
      ------------------------- */

      .titulo {

        top: 25px;

        left: 25px;

        right: 25px;
      }

      .titulo h1 {
        font-size: 20px;

        letter-spacing: 4px;
      }


      /* -------------------------
         CAPA
      ------------------------- */

      .capa {

        width: min(380px, 100%);

        min-width: 0;

        max-width: 380px;

        height: 65vh;

        min-height: 500px;
      }


      /* -------------------------
         CATÁLOGO
      ------------------------- */

      .catalogo {

        width: 100%;

        height: 600px;

        flex-shrink: 0;
      }


      /* -------------------------
         CASOS NO CELULAR
      ------------------------- */

      .lista-casos {

        grid-template-columns: 1fr;

        grid-template-rows: none;

        grid-auto-rows: 250px;

        overflow-y: auto;
      }


      /* -------------------------
         DECORAÇÃO
      ------------------------- */

      .decoracao {

        display: none;
      }
    }


    /* =========================================
       CELULARES PEQUENOS
    ========================================= */

    @media (max-width: 450px) {

      .pagina {
        padding-left: 15px;
        padding-right: 15px;
      }

      .titulo {
        left: 15px;
        right: 15px;
      }

      .titulo h1 {
        font-size: 17px;

        letter-spacing: 3px;
      }

      .capa {
        height: 60vh;

        min-height: 450px;
      }

      .nome-caso {
        font-size: 21px;

        letter-spacing: 3px;
      }

      .descricao-caso {
        font-size: 9px;
      }

      .catalogo-titulo {
        font-size: 11px;

        letter-spacing: 3px;
      }

      .linha-catalogo {
        width: 50px;
      }
    }

  </style>

</head>
